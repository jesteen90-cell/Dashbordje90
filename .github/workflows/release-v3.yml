name: Release Model 3.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-model-v3
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Verify release inputs
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_FREE_TRANSFERS: ${{ secrets.FPL_FREE_TRANSFERS }}
        run: |
          echo "Model 3.0 release preflight"
          test -n "$FPL_TEAM_ID" || { echo "ERROR: Missing FPL_TEAM_ID"; exit 1; }
          if [ -z "$FPL_FREE_TRANSFERS" ]; then echo "FPL_FREE_TRANSFERS unset; safe fallback=1"; fi
          python - <<'PY'
          import json
          for path in ('recent_form_ab_status.json','captain_v3_status.json','transfer_strategy_params.json'):
              d=json.load(open(path)); print(path,'promote=',d.get('promote'))
              assert d.get('promote') is True, path
          print('All Model 3.0 promotion gates are green')
          PY
      - name: Generate Model 3.0 feed
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_FREE_TRANSFERS: ${{ secrets.FPL_FREE_TRANSFERS }}
        run: |
          if [ -z "$FPL_FREE_TRANSFERS" ]; then export FPL_FREE_TRANSFERS=1; fi
          python generate_dashboard_v3.py
      - name: Release gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data.json'))
          checks={
            'model_version': d.get('model_version')=='3.0-validated',
            'recent_form': d.get('recent_form',{}).get('promoted') is True,
            'captain_v3': d.get('captain_model',{}).get('promoted') is True,
            'current_xi_11': len(d.get('comparison',{}).get('current_xi',[]))==11,
            'lineup_11': len(d.get('lineup',[]))==11,
            'deadline': bool(d.get('deadline_time')),
          }
          print('Release checks:',checks)
          assert all(checks.values()), checks
          print('RELEASE READY',d['generated_at'],'GW',d['gw'],'headline',d.get('headline'))
          PY
      - name: Publish Model 3.0 feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Feed already current"
          else
            git commit -m "Release Model 3.0 live feed"
            git push
          fi
