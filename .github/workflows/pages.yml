name: Deploy dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - "data.json"
      - "premium_structure_shadow.json"
      - "chip_strategy_shadow.json"
      - "captain_v4_shadow.json"
      - "captain_diagnostics.json"
      - "snapshots/**"
      - "backtest/**"
      - "market_ab/**"
      - "market_ab_snapshots/**"
      - "captain_snapshots/**"
      - "premium_structure_snapshots/**"
      - "chip_snapshots/**"
      - "option_value_snapshots/**"
      - "option_value_backtest/**"
      - "timing_snapshots/**"
      - "timing_backtest/**"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Enrich Budget Option Timing Robustness Final Gate Plan Bench Regret Confidence Lock
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard only
        uses: actions/checkout@v4
      - name: Inject captain explanation UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="captain_explain_ui.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
