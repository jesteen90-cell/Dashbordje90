name: Refresh FPL Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate_dashboard_v3.py"
      - "build_dashboard_with_cache.py"
      - "premium_structure_v1.py"
      - "freeze_premium_structure.py"
      - "evaluate_premium_structure.py"
      - "derive_premium_structure_feedback.py"
      - "chip_strategy_v1.py"
      - "enrich_chip_fixture_counts.py"
      - "freeze_chip_strategy.py"
      - "market_ensemble_v1.py"
      - "market_ab_shadow.py"
      - "player_attack_share_v1.py"
      - "freeze_market_ab.py"
      - "evaluate_market_ab.py"
      - "captain_v4_prior.py"
      - "captain_haul_v41.py"
      - "captain_horizon_v1.py"
      - "expand_captain_pool.py"
      - "enrich_captain_inputs.py"
      - "captain_v4_shadow.py"
      - "captain_diagnostics.py"
      - "evaluate_captain_v4.py"
      - "select_captain_model.py"
      - "apply_captain_selection.py"
      - "apply_confirmed_fpl_lineup.py"
      - "captain_explain_ui.js"
      - "freeze_captain_v4.py"
      - "market_odds.json"
      - "decision_layer_v4.py"
      - "freeze_snapshot.py"
      - "evaluate_frozen_snapshots.py"
      - "model_v2_core.py"
      - "model_live_sanity.py"
      - "fetch_team_strength_prior.py"
      - "team_strength_v2.py"
      - "player_form_v2.py"
      - "recent_form_v2.py"
      - "transfer_optimizer_v2.py"
      - "transfer_strategy_params.json"
      - "recent_form_ab_status.json"
      - "captain_v3_status.json"
      - ".github/workflows/refresh.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
concurrency:
  group: dashboard-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Regression-check xP core
        run: python model_live_sanity.py
      - name: Preflight validated inputs
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: |
          test -n "$FPL_TEAM_ID" || { echo "Missing FPL_TEAM_ID repository secret"; exit 1; }
          test -f recent_form_ab_status.json
          test -f captain_v3_status.json
          test -f transfer_strategy_params.json
          python - <<'PY'
          import json
          rf=json.load(open('recent_form_ab_status.json')); cap=json.load(open('captain_v3_status.json')); tr=json.load(open('transfer_strategy_params.json'))
          assert rf.get('promote') is True
          assert cap.get('promote') is True
          assert tr.get('promote') is True
          PY
      - name: Evaluate completed frozen snapshots
        run: |
          python evaluate_frozen_snapshots.py
          python evaluate_market_ab.py
          python evaluate_captain_v4.py
          python evaluate_premium_structure.py
          python derive_premium_structure_feedback.py
      - name: Build validated dashboard feed
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_FREE_TRANSFERS: ${{ secrets.FPL_FREE_TRANSFERS }}
        run: |
          if [ -z "$FPL_FREE_TRANSFERS" ]; then export FPL_FREE_TRANSFERS=1; fi
          python fetch_team_strength_prior.py
          python build_dashboard_with_cache.py
          python decision_layer_v4.py
          python expand_captain_pool.py
          python enrich_captain_inputs.py
          python captain_v4_shadow.py
          python captain_diagnostics.py
          python select_captain_model.py
          python apply_captain_selection.py
          python market_ab_shadow.py
          python premium_structure_v1.py
          python chip_strategy_v1.py
          python enrich_chip_fixture_counts.py
          python apply_confirmed_fpl_lineup.py
      - name: Sanity-check generated feed
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data.json'))
          pri=json.load(open('team_strength_prior.json')); assert pri.get('version') in ('1.0-fpl-bootstrap','1.1-fpl-bootstrap-safe'); assert len(pri.get('teams') or {})==20
          assert d.get('model_version') in ('3.0-validated','3.1-market-ready','3.2-history-prior','3.3-fixture-strength-v2','3.4-fixture-outlook'), d.get('model_version')
          if d.get('model_version') in ('3.2-history-prior','3.3-fixture-strength-v2','3.4-fixture-outlook'):
            hp=d.get('historical_attack_prior') or {}; assert hp.get('version')=='1.0-prev-season-fade'; assert int(hp.get('coverage') or 0)>0
          if d.get('model_version') in ('3.3-fixture-strength-v2','3.4-fixture-outlook'):
            sm=d.get('team_strength_model') or {}; assert sm.get('version')=='2.1-adaptive-early-season'; assert sm.get('prior_sources'); ts=d.get('team_strength') or {}; assert len(ts)==20
            assert all(0<=float((r or {}).get('evidence_share',0))<=1 for r in ts.values()); assert all((r or {}).get('prior_source') in ('fpl-bootstrap','table-shrunk','neutral-fallback') for r in ts.values())
          if d.get('model_version')=='3.4-fixture-outlook':
            rows=(d.get('lineup') or [])+(d.get('bench') or []); assert rows
            assert all(isinstance(p.get('fixture_outlook'),list) for p in rows)
            assert all(1<=int(f.get('difficulty'))<=5 for p in rows for f in p.get('fixture_outlook',[]))
            assert all(len(p.get('fixture_outlook') or [])>=3 for p in rows), 'Each squad player needs at least 3 fixture entries'
          opt=d.get('optimizer',{}); assert opt.get('captain_horizon_search') is True, opt
          pool=d.get('captain_pool') or {}; assert pool.get('version')=='1.0-all-xi'; assert int(pool.get('candidate_count') or 0)==11,pool; assert int(pool.get('display_count') or 0)<=5,pool
          assert d.get('captain_v4_inputs',{}).get('enriched') is True
          cap4=json.load(open('captain_v4_shadow.json')); assert cap4.get('version')=='4.1-haul-shadow'; assert int(cap4.get('gw'))==int(d.get('gw')); assert len(cap4.get('candidates') or [])==11
          diag=json.load(open('captain_diagnostics.json')); assert diag.get('version')=='1.0'; assert int(diag.get('candidate_count') or 0)==11
          sel=d.get('captain_model_selection') or {}; assert sel.get('version')=='1.0'; assert sel.get('applied') is True; assert sel.get('applied_captain_id')
          xi=d.get('lineup') or []; caps=[p for p in xi if p.get('captain')]; vice=[p for p in xi if p.get('vice')]; assert len(xi)==11; assert len(caps)==1; assert len(vice)==1; assert int(caps[0]['id'])==int(sel['applied_captain_id'])
          ex=d.get('captain_explanation') or {}; assert ex.get('version') in ('1.0','1.1-confidence-data','1.2-confidence-quality','1.3-confidence-source-quality'); assert int(ex.get('captain',{}).get('id'))==int(sel.get('applied_captain_id'))
          confirmed=d.get('confirmed_fpl') or {}; assert confirmed.get('source')=='official-picks-api'; assert confirmed.get('exact_order') is True; assert len(confirmed.get('lineup') or [])==11; assert len(confirmed.get('bench') or [])==4; assert len([p for p in confirmed['lineup'] if p.get('captain')])==1; assert len([p for p in confirmed['lineup'] if p.get('vice')])==1; assert [p['id'] for p in (d.get('comparison') or {}).get('current_xi',[])]==[p['id'] for p in confirmed['lineup']]
          dl=d.get('decision_layer',{}); assert dl.get('version') in ('4.4-premium-adaptive','4.5-squad-consistent','4.6-input-quality-threshold'); assert dl.get('squad_view_consistent') is True
          if dl.get('version')=='4.6-input-quality-threshold':
            iq=dl.get('input_quality') or {}; assert 0<=float(iq.get('score',0))<=1; assert 0<=float(iq.get('threshold_penalty',0))<=.24; assert iq.get('strength_quality'); assert isinstance(iq.get('market_active'),bool); assert float(dl.get('threshold'))>=float(dl.get('base_threshold'))
            de=d.get('decision_explanation') or {}; assert (de.get('input_quality') or {}).get('score')==iq.get('score')
          premium=json.load(open('premium_structure_shadow.json')); assert premium.get('version')=='1.1-backtest-ready'
          chip=json.load(open('chip_strategy_shadow.json')); assert chip.get('version')=='1.4-exact-fixtures'
          cache=json.load(open('projection_cache.json')); assert len(cache.get('players',[]))>400; assert len(cache.get('squad_ids',[]))==15
          print('Sanity OK:',d.get('model_version'),dl.get('version'),'threshold',dl.get('threshold'),'input quality',dl.get('input_quality'),'confirmed GW',confirmed.get('gw'))
          PY
      - name: Freeze pre-deadline snapshots
        run: |
          python freeze_snapshot.py
          python freeze_market_ab.py
          python freeze_captain_v4.py
          python freeze_premium_structure.py
          python freeze_chip_strategy.py
      - name: Publish feed, snapshots and backtests
        run: |
          if git diff --quiet -- data.json premium_structure_shadow.json chip_strategy_shadow.json captain_v4_shadow.json captain_diagnostics.json snapshots/ backtest/ market_ab/ market_ab_snapshots/ captain_snapshots/ premium_structure_snapshots/ chip_snapshots/; then echo "No dashboard, snapshot or backtest change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json premium_structure_shadow.json chip_strategy_shadow.json captain_v4_shadow.json captain_diagnostics.json snapshots/ backtest/ market_ab/ market_ab_snapshots/ captain_snapshots/ premium_structure_snapshots/ chip_snapshots/
          git commit -m "Dashboard: refresh validated model feed"
          git push
