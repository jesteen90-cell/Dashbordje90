name: Refresh FPL Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate_dashboard_v3.py"
      - "build_dashboard_with_cache.py"
      - "premium_structure_v1.py"
      - "market_ensemble_v1.py"
      - "market_ab_shadow.py"
      - "player_attack_share_v1.py"
      - "freeze_market_ab.py"
      - "evaluate_market_ab.py"
      - "captain_v4_prior.py"
      - "captain_horizon_v1.py"
      - "enrich_captain_inputs.py"
      - "captain_v4_shadow.py"
      - "evaluate_captain_v4.py"
      - "freeze_captain_v4.py"
      - "market_odds.json"
      - "decision_layer_v4.py"
      - "freeze_snapshot.py"
      - "evaluate_frozen_snapshots.py"
      - "model_v2_core.py"
      - "model_live_sanity.py"
      - "team_strength_v2.py"
      - "player_form_v2.py"
      - "recent_form_v2.py"
      - "transfer_optimizer_v2.py"
      - "transfer_strategy_params.json"
      - "recent_form_ab_status.json"
      - "captain_v3_status.json"
      - ".github/workflows/refresh.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
concurrency:
  group: dashboard-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Regression-check xP core
        run: python model_live_sanity.py
      - name: Preflight validated inputs
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: |
          test -n "$FPL_TEAM_ID" || { echo "Missing FPL_TEAM_ID repository secret"; exit 1; }
          test -f recent_form_ab_status.json
          test -f captain_v3_status.json
          test -f transfer_strategy_params.json
          python - <<'PY'
          import json
          rf=json.load(open('recent_form_ab_status.json')); cap=json.load(open('captain_v3_status.json')); tr=json.load(open('transfer_strategy_params.json'))
          assert rf.get('promote') is True
          assert cap.get('promote') is True
          assert tr.get('promote') is True
          PY
      - name: Evaluate completed frozen snapshots
        run: |
          python evaluate_frozen_snapshots.py
          python evaluate_market_ab.py
          python evaluate_captain_v4.py
      - name: Build validated dashboard feed
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_FREE_TRANSFERS: ${{ secrets.FPL_FREE_TRANSFERS }}
        run: |
          if [ -z "$FPL_FREE_TRANSFERS" ]; then export FPL_FREE_TRANSFERS=1; fi
          python build_dashboard_with_cache.py
          python decision_layer_v4.py
          python enrich_captain_inputs.py
          python captain_v4_shadow.py
          python market_ab_shadow.py
          python premium_structure_v1.py
      - name: Sanity-check generated feed
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data.json')); assert d.get('model_version')=='3.1-market-ready'
          opt=d.get('optimizer',{}); assert opt.get('captain_horizon_search') is True, opt
          assert d.get('captain_v4_inputs',{}).get('enriched') is True
          for p in d.get('captain_comparison',[]):
            assert p.get('season_minutes') is not None and p.get('season_xg') is not None and p.get('season_xa') is not None
          cap4=json.load(open('captain_v4_shadow.json')); assert cap4.get('version')=='4.0-shadow'; assert int(cap4.get('gw'))==int(d.get('gw')); assert cap4.get('v3_pick') and cap4.get('v4_pick')
          capscore=json.load(open('backtest/captain_v4_scorecard.json')); assert capscore.get('version')=='1.0'; assert 'v4_delta_points' in capscore
          premium=json.load(open('premium_structure_shadow.json')); assert premium.get('version')=='1.0-shadow'; assert int(premium.get('gw'))==int(d.get('gw')); assert premium.get('verdict') in ('current_structure','premium_forward','premium_midfielder'); assert 'current_horizon_value' in premium
          cache=json.load(open('projection_cache.json')); assert len(cache.get('players',[]))>400; assert len(cache.get('squad_ids',[]))==15
          me=d.get('market_ensemble',{}); assert 'available' in me and 'active' in me
          dl=d.get('decision_layer',{}); assert dl.get('version')=='4.3-component-adaptive'
          assert d.get('deadline_time') and len(d.get('lineup',[]))==11
          score=json.load(open('backtest/scorecard.json')); assert score.get('version')=='2.0'
          ab=json.load(open('market_ab/scorecard.json')); assert ab.get('version')=='1.2-player-share'; assert 'offensive_mae_share' in ab and 'promote_player_share' in ab
          params=json.load(open('market_ab/params.json')); assert params.get('version')=='1.2-player-share'; assert 'promote_player_share' in params
          shadow=json.load(open('market_ab_shadow.json')); assert int(shadow.get('gw'))==int(d.get('gw')); assert shadow.get('version')=='1.2-player-share'
          for p in shadow.get('players',[]): assert 'share_ensemble_xp' in p and 'goal_share' in p and 'assist_share' in p
          print('Premium structure + captain horizon sanity passed',premium.get('verdict'),premium.get('best_premium_forward'),premium.get('best_premium_midfielder'))
          PY
      - name: Freeze pre-deadline snapshots
        run: |
          python freeze_snapshot.py
          python freeze_market_ab.py
          python freeze_captain_v4.py
      - name: Publish feed, snapshots and backtests
        run: |
          if git diff --quiet -- data.json premium_structure_shadow.json snapshots/ backtest/ market_ab/ market_ab_snapshots/ captain_snapshots/; then
            echo "No dashboard, snapshot or backtest change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json premium_structure_shadow.json snapshots/ backtest/ market_ab/ market_ab_snapshots/ captain_snapshots/
          git commit -m "Dashboard: refresh analysis and premium structure shadow"
          git push
