name: Refresh FPL Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate_dashboard_v3.py"
      - "build_dashboard_with_cache.py"
      - "premium_structure_v1.py"
      - "freeze_premium_structure.py"
      - "evaluate_premium_structure.py"
      - "derive_premium_structure_feedback.py"
      - "chip_strategy_v1.py"
      - "enrich_chip_fixture_counts.py"
      - "freeze_chip_strategy.py"
      - "market_ensemble_v1.py"
      - "market_ab_shadow.py"
      - "player_attack_share_v1.py"
      - "freeze_market_ab.py"
      - "evaluate_market_ab.py"
      - "captain_v4_prior.py"
      - "captain_horizon_v1.py"
      - "enrich_captain_inputs.py"
      - "captain_v4_shadow.py"
      - "evaluate_captain_v4.py"
      - "freeze_captain_v4.py"
      - "market_odds.json"
      - "decision_layer_v4.py"
      - "freeze_snapshot.py"
      - "evaluate_frozen_snapshots.py"
      - "model_v2_core.py"
      - "model_live_sanity.py"
      - "team_strength_v2.py"
      - "player_form_v2.py"
      - "recent_form_v2.py"
      - "transfer_optimizer_v2.py"
      - "transfer_strategy_params.json"
      - "recent_form_ab_status.json"
      - "captain_v3_status.json"
      - ".github/workflows/refresh.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
concurrency:
  group: dashboard-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Regression-check xP core
        run: python model_live_sanity.py
      - name: Preflight validated inputs
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: |
          test -n "$FPL_TEAM_ID" || { echo "Missing FPL_TEAM_ID repository secret"; exit 1; }
          test -f recent_form_ab_status.json
          test -f captain_v3_status.json
          test -f transfer_strategy_params.json
          python - <<'PY'
          import json
          rf=json.load(open('recent_form_ab_status.json')); cap=json.load(open('captain_v3_status.json')); tr=json.load(open('transfer_strategy_params.json'))
          assert rf.get('promote') is True
          assert cap.get('promote') is True
          assert tr.get('promote') is True
          PY
      - name: Evaluate completed frozen snapshots
        run: |
          python evaluate_frozen_snapshots.py
          python evaluate_market_ab.py
          python evaluate_captain_v4.py
          python evaluate_premium_structure.py
          python derive_premium_structure_feedback.py
      - name: Build validated dashboard feed
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_FREE_TRANSFERS: ${{ secrets.FPL_FREE_TRANSFERS }}
        run: |
          if [ -z "$FPL_FREE_TRANSFERS" ]; then export FPL_FREE_TRANSFERS=1; fi
          python build_dashboard_with_cache.py
          python decision_layer_v4.py
          python enrich_captain_inputs.py
          python captain_v4_shadow.py
          python market_ab_shadow.py
          python premium_structure_v1.py
          python chip_strategy_v1.py
          python enrich_chip_fixture_counts.py
      - name: Sanity-check generated feed
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data.json')); assert d.get('model_version')=='3.1-market-ready'
          opt=d.get('optimizer',{}); assert opt.get('captain_horizon_search') is True, opt
          assert d.get('captain_v4_inputs',{}).get('enriched') is True
          for p in d.get('captain_comparison',[]): assert p.get('season_minutes') is not None and p.get('season_xg') is not None and p.get('season_xa') is not None
          cap4=json.load(open('captain_v4_shadow.json')); assert cap4.get('version')=='4.0-shadow'; assert int(cap4.get('gw'))==int(d.get('gw')); assert cap4.get('v3_pick') and cap4.get('v4_pick')
          premium=json.load(open('premium_structure_shadow.json')); assert premium.get('version')=='1.1-backtest-ready'; assert int(premium.get('gw'))==int(d.get('gw')); assert len(premium.get('current_squad_ids',[]))==15
          chip=json.load(open('chip_strategy_shadow.json')); assert chip.get('version')=='1.4-exact-fixtures'; assert chip.get('fixture_count_model',{}).get('version')=='1.0-exact'; assert int(chip.get('gw'))==int(d.get('gw')); assert chip.get('mode')=='shadow_only'; assert chip.get('tc_decision') in ('HOLD','CONSIDER','USE_NOW'); assert set(chip.get('scores',{}))=={'wildcard','free_hit','bench_boost','triple_captain'}; assert isinstance(chip.get('chip_roadmap'),list)
          ce=chip.get('evidence',{}); exact=ce.get('exact_fixture_diagnostics') or []; assert exact; assert all('squad_blank_count' in r and 'squad_double_count' in r and 'team_fixture_counts' in r for r in exact); assert 'exact_free_hit_candidate_gw' in ce and 'exact_bench_boost_candidate_gw' in ce
          if chip.get('chip_roadmap'):
            gws=[x['gw'] for x in chip['chip_roadmap']]; assert len(gws)==len(set(gws))
          cache=json.load(open('projection_cache.json')); assert len(cache.get('players',[]))>400; assert len(cache.get('squad_ids',[]))==15
          dl=d.get('decision_layer',{}); assert dl.get('version')=='4.4-premium-adaptive'
          print('Exact fixture-count chip sanity passed',[(r['gw'],r['squad_blank_count'],r['squad_double_count']) for r in exact])
          PY
      - name: Freeze pre-deadline snapshots
        run: |
          python freeze_snapshot.py
          python freeze_market_ab.py
          python freeze_captain_v4.py
          python freeze_premium_structure.py
          python freeze_chip_strategy.py
      - name: Publish feed, snapshots and backtests
        run: |
          if git diff --quiet -- data.json premium_structure_shadow.json chip_strategy_shadow.json snapshots/ backtest/ market_ab/ market_ab_snapshots/ captain_snapshots/ premium_structure_snapshots/ chip_snapshots/; then
            echo "No dashboard, snapshot or backtest change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json premium_structure_shadow.json chip_strategy_shadow.json snapshots/ backtest/ market_ab/ market_ab_snapshots/ captain_snapshots/ premium_structure_snapshots/ chip_snapshots/
          git commit -m "Dashboard: refresh analysis and exact-fixture chip shadow"
          git push
