name: Refresh FPL Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: dashboard-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Build sanitized dashboard feed
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: |
          if [ -z "$FPL_TEAM_ID" ]; then
            echo "FPL_TEAM_ID secret is not configured; keeping current dashboard data."
            exit 0
          fi
          python generate_dashboard.py
      - name: Publish updated feed
        run: |
          if git diff --quiet -- data.json; then
            echo "No dashboard change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Dashboard: refresh public FPL analysis"
          git push
