name: Refresh FPL Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate_dashboard_v3.py"
      - "market_ensemble_v1.py"
      - "market_ab_shadow.py"
      - "freeze_market_ab.py"
      - "evaluate_market_ab.py"
      - "market_odds.json"
      - "decision_layer_v4.py"
      - "freeze_snapshot.py"
      - "evaluate_frozen_snapshots.py"
      - "model_v2_core.py"
      - "model_live_sanity.py"
      - "team_strength_v2.py"
      - "player_form_v2.py"
      - "recent_form_v2.py"
      - "transfer_optimizer_v2.py"
      - "transfer_strategy_params.json"
      - "recent_form_ab_status.json"
      - "captain_v3_status.json"
      - ".github/workflows/refresh.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
concurrency:
  group: dashboard-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Regression-check xP core
        run: python model_live_sanity.py
      - name: Preflight validated inputs
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: |
          test -n "$FPL_TEAM_ID" || { echo "Missing FPL_TEAM_ID repository secret"; exit 1; }
          test -f recent_form_ab_status.json
          test -f captain_v3_status.json
          test -f transfer_strategy_params.json
          python - <<'PY'
          import json
          rf=json.load(open('recent_form_ab_status.json')); cap=json.load(open('captain_v3_status.json')); tr=json.load(open('transfer_strategy_params.json'))
          assert rf.get('promote') is True
          assert cap.get('promote') is True
          assert tr.get('promote') is True
          PY
      - name: Evaluate completed frozen snapshots
        run: |
          python evaluate_frozen_snapshots.py
          python evaluate_market_ab.py
      - name: Build validated dashboard feed
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_FREE_TRANSFERS: ${{ secrets.FPL_FREE_TRANSFERS }}
        run: |
          if [ -z "$FPL_FREE_TRANSFERS" ]; then export FPL_FREE_TRANSFERS=1; fi
          python generate_dashboard_v3.py
          python decision_layer_v4.py
          python market_ab_shadow.py
      - name: Sanity-check generated feed
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data.json'))
          assert d.get('model_version')=='3.1-market-ready'
          me=d.get('market_ensemble',{}); assert 'available' in me and 'active' in me and me.get('method')
          if not me.get('available'): assert me.get('active') is False
          dl=d.get('decision_layer',{}); assert dl.get('version')=='4.3-component-adaptive'
          assert dl.get('explainability') is True and dl.get('captain_comparison') is True
          assert dl.get('backtest_adaptive') is True and dl.get('component_adaptive') is True
          assert 0.90 <= float(dl.get('threshold')) <= 1.45
          controls=dl.get('controls',{}); assert 0.85 <= float(controls.get('minutes_penalty_scale',1)) <= 1.25; assert 0.90 <= float(controls.get('availability_penalty_scale',1)) <= 1.25
          assert d.get('deadline_time') and len(d.get('comparison',{}).get('current_xi',[]))==11 and len(d.get('lineup',[]))==11
          assert d.get('recent_form',{}).get('promoted') is True and d.get('captain_model',{}).get('promoted') is True
          assert d.get('decision_explanation',{}).get('decision') in ('BANK','BYTT') and len(d.get('captain_comparison',[]))>=3
          bench=d.get('bench',[])
          if bench: assert bench[-1].get('position')=='GK'
          score=json.load(open('backtest/scorecard.json')); assert score.get('version')=='2.0'; assert 'minutes_mae' in score and 'position_diagnostics' in score
          ab=json.load(open('market_ab/scorecard.json')); assert ab.get('version')=='1.1-two-sided'; assert 'offensive_mae_internal' in ab and 'captain_proxy_regret_internal' in ab
          params=json.load(open('market_ab/params.json')); assert params.get('version')=='1.1-two-sided'; assert 'offensive_mae_improvement' in params.get('evidence',{})
          shadow=json.load(open('market_ab_shadow.json')); assert int(shadow.get('gw'))==int(d.get('gw')); assert shadow.get('version')=='1.1-two-sided'
          if params.get('promoted'): assert me.get('ab_promoted') is True
          print('Two-sided market A/B sanity passed',ab.get('active_gws'),ab.get('offensive_mae_improvement'),ab.get('captain_proxy_improvement'))
          PY
      - name: Freeze pre-deadline snapshots
        run: |
          python freeze_snapshot.py
          python freeze_market_ab.py
      - name: Publish feed, snapshots and backtests
        run: |
          if git diff --quiet -- data.json snapshots/ backtest/ market_ab/ market_ab_snapshots/; then
            echo "No dashboard, snapshot or backtest change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json snapshots/ backtest/ market_ab/ market_ab_snapshots/
          git commit -m "Dashboard: refresh analysis and frozen A/B evidence"
          git push
