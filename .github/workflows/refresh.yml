name: Refresh FPL Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate_dashboard_v3.py"
      - "decision_layer_v4.py"
      - "freeze_snapshot.py"
      - "evaluate_frozen_snapshots.py"
      - "model_v2_core.py"
      - "model_live_sanity.py"
      - "team_strength_v2.py"
      - "player_form_v2.py"
      - "recent_form_v2.py"
      - "transfer_optimizer_v2.py"
      - "transfer_strategy_params.json"
      - "recent_form_ab_status.json"
      - "captain_v3_status.json"
      - ".github/workflows/refresh.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: dashboard-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Regression-check xP core
        run: python model_live_sanity.py
      - name: Preflight Model 3.0 inputs
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: |
          test -n "$FPL_TEAM_ID" || { echo "Missing FPL_TEAM_ID repository secret"; exit 1; }
          test -f recent_form_ab_status.json
          test -f captain_v3_status.json
          test -f transfer_strategy_params.json
          python - <<'PY'
          import json
          rf=json.load(open('recent_form_ab_status.json')); cap=json.load(open('captain_v3_status.json')); tr=json.load(open('transfer_strategy_params.json'))
          assert rf.get('promote') is True, 'recent form not promoted'
          assert cap.get('promote') is True, 'captain v3 not promoted'
          assert tr.get('promote') is True, 'transfer strategy not promoted'
          print('Validated Model 3.0 inputs present')
          PY
      - name: Evaluate completed frozen snapshots
        run: python evaluate_frozen_snapshots.py
      - name: Build validated dashboard feed
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_FREE_TRANSFERS: ${{ secrets.FPL_FREE_TRANSFERS }}
        run: |
          if [ -z "$FPL_FREE_TRANSFERS" ]; then export FPL_FREE_TRANSFERS=1; fi
          python generate_dashboard_v3.py
          python decision_layer_v4.py
      - name: Sanity-check generated feed
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data.json'))
          assert d.get('model_version')=='3.0-validated', d.get('model_version')
          dl=d.get('decision_layer',{})
          assert dl.get('version')=='4.2-backtest-adaptive', dl.get('version')
          assert dl.get('explainability') is True
          assert dl.get('captain_comparison') is True
          assert dl.get('backtest_adaptive') is True
          assert 0.90 <= float(dl.get('threshold')) <= 1.45
          assert d.get('deadline_time')
          assert len(d.get('comparison',{}).get('current_xi',[]))==11
          assert len(d.get('lineup',[]))==11
          assert d.get('recent_form',{}).get('promoted') is True
          assert d.get('captain_model',{}).get('promoted') is True
          assert d.get('decision_explanation',{}).get('decision') in ('BANK','BYTT')
          assert len(d.get('captain_comparison',[]))>=3
          for p in d.get('lineup',[]):
            if float(p.get('availability',0))>=.99:
              assert float(p.get('expected_minutes',0))>0,(p.get('name'),p.get('expected_minutes'))
          bench=d.get('bench',[])
          if bench:
            assert bench[-1].get('position')=='GK', 'Goalkeeper should be last on bench'
          score=json.load(open('backtest/scorecard.json'))
          assert score.get('version')=='1.0'
          print('Model 3.0 + decision layer 4.2 sanity check passed:', d.get('generated_at'))
          PY
      - name: Freeze first valid pre-deadline snapshot
        run: python freeze_snapshot.py
      - name: Publish feed, snapshots and backtest
        run: |
          if git diff --quiet -- data.json snapshots/ backtest/; then
            echo "No dashboard, snapshot or backtest change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json snapshots/ backtest/
          git commit -m "Dashboard: refresh analysis, snapshots and backtest"
          git push
