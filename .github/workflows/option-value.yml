name: Enrich Budget Option and Timing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "budget_intelligence_v1.py"
      - "transfer_option_value_v1.py"
      - "transfer_timing_v1.py"
      - "freeze_option_value.py"
      - "evaluate_option_value.py"
      - "freeze_transfer_timing.py"
      - "evaluate_transfer_timing.py"
      - ".github/workflows/option-value.yml"
  workflow_run:
    workflows: ["Refresh FPL Dashboard"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: dashboard-option-value
  cancel-in-progress: true

jobs:
  enrich:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Build budget intelligence shadow
        run: python budget_intelligence_v1.py
      - name: Build deadline timing shadow
        run: python transfer_timing_v1.py
      - name: Build transfer option value shadow
        run: python transfer_option_value_v1.py
      - name: Sanity-check budget option and timing feed
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data.json'))
          bi=d.get('budget_intelligence') or {}
          assert bi.get('version')=='1.2-shadow', bi.get('version')
          assert bi.get('affects_transfer_ranking') is False
          assert bi.get('squad_source')=='confirmed_fpl + bootstrap-static'
          assert int(bi.get('squad_players_found') or 0)==15, bi.get('squad_players_found')
          assert float(bi.get('squad_market_value') or 0)>0
          assert 0 <= float((bi.get('flexibility') or {}).get('score',0)) <= 1
          pool=d.get('transfer_option_pool') or {}
          assert pool.get('version')=='1.0-compact'
          assert len(pool.get('owned_ids') or [])==15
          assert len(pool.get('players') or [])>=15
          assert len(pool.get('gws') or [])>=2
          timing=d.get('transfer_timing') or {}
          assert timing.get('version')=='1.0-shadow', timing
          assert timing.get('affects_transfer_ranking') is False
          assert timing.get('price_prediction') is False
          assert float(timing.get('hours_to_deadline') or 0)>=0
          tov=d.get('transfer_option_value') or {}
          assert tov.get('version')=='1.1-shadow', tov.get('version')
          assert tov.get('source')=='data.json transfer_option_pool'
          assert tov.get('affects_transfer_ranking') is False
          base=tov.get('baseline_bank_action') or {}
          assert 1 <= int(base.get('future_free_transfers') or 0) <= 5
          assert int(base.get('affordable_upgrade_paths') or 0)>=0
          candidates=d.get('candidates') or []
          for c in candidates:
              tv=c.get('timing_value_shadow') or {}
              assert tv.get('version')=='1.0'
              assert tv.get('affects_ranking') is False
              assert tv.get('price_prediction') is False
              assert 0<=float(tv.get('lock_risk') or 0)<=1
              assert 0<=float(tv.get('information_value') or 0)<=1
              ov=c.get('option_value_shadow') or {}
              assert ov.get('version')=='1.1'
              assert ov.get('affects_ranking') is False
              assert float(ov.get('total',0)) >= 0
              assert int(ov.get('affordable_upgrade_paths') or 0) >= 0
              assert 1 <= int(ov.get('future_free_transfers') or 0) <= 5
          print('Budget/option/timing sanity OK',bi.get('flexibility'),base,'pool',len(pool.get('players') or []),'candidates',len(candidates))
          PY
      - name: Evaluate completed option-value snapshots
        run: python evaluate_option_value.py
      - name: Freeze pre-deadline option-value snapshot
        run: python freeze_option_value.py
      - name: Evaluate completed timing snapshots
        run: python evaluate_transfer_timing.py
      - name: Freeze pre-deadline timing snapshot
        run: python freeze_transfer_timing.py
      - name: Sanity-check evidence scorecards
        run: |
          python - <<'PY'
          import json
          s=json.load(open('option_value_backtest/scorecard.json'))
          assert s.get('version')=='1.0'
          assert int(s.get('evaluated_gws') or 0)>=0
          assert isinstance(s.get('promote'),bool)
          assert isinstance(s.get('promotion_ready'),bool)
          if int(s.get('evaluated_gws') or 0)<8: assert s.get('promote') is False
          t=json.load(open('timing_backtest/scorecard.json'))
          assert t.get('version')=='1.0'
          assert int(t.get('candidate_samples') or 0)>=0
          assert isinstance(t.get('calibration_ready'),bool)
          assert isinstance(t.get('promote_timing_thresholds'),bool)
          if int(t.get('candidate_samples') or 0)<20: assert t.get('promote_timing_thresholds') is False
          print('Evidence sanity OK',s,t)
          PY
      - name: Publish enriched feed and evidence
        run: |
          if git diff --quiet -- data.json option_value_snapshots/ option_value_backtest/ timing_snapshots/ timing_backtest/; then echo "No budget/option/timing change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json option_value_snapshots/ option_value_backtest/ timing_snapshots/ timing_backtest/
          git commit -m "Dashboard: enrich and evaluate option and timing"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
