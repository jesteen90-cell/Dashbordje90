name: Model v2 backtest
on:
  workflow_dispatch:
  push:
    branches: [model-v2]
    paths:
      - 'model_v2_core.py'
      - 'backtest.py'
      - 'build_backtest_dataset.py'
      - '.github/workflows/backtest-v2.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build leakage-safe historical dataset
        run: python build_backtest_dataset.py --seasons 2023-24 2024-25 2025-26 --out backtest_dataset.json
      - name: Evaluate v2 against rolling baseline
        run: python backtest.py backtest_dataset.json --out backtest_results.json
      - name: Show promotion quality gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('backtest_results.json'))
          print('Dataset SHA256:',r.get('dataset_sha256'))
          print('Rows:',r['n'],'Evaluated GWs:',r.get('evaluated_gameweeks'))
          print('V2 MAE:',round(r['mae'],4),'Baseline:',round(r.get('baseline_mae',999),4))
          print('MAE improvement %:',round(r.get('mae_improvement_pct',0),2))
          print('Within-GW rank corr:',round(r.get('within_gw_rank_corr',0),4))
          print('Captain delta:',r.get('captain_delta'),'W/T/L:',r.get('captain_vs_baseline_wins'),r.get('captain_vs_baseline_ties'),r.get('captain_vs_baseline_losses'))
          print('Top-5 delta:',round(r.get('top5_delta',0),2))
          print('By season:',r.get('by_season',{}))
          print('By position:',r.get('by_position',{}))
          if r['n'] < 5000: raise SystemExit('FAIL: insufficient evaluation sample')
          if r.get('evaluated_gameweeks',0) < 75: raise SystemExit('FAIL: insufficient walk-forward gameweeks')
          if r['mae'] >= r.get('baseline_mae',999): raise SystemExit('FAIL: v2 does not beat baseline MAE')
          if r.get('within_gw_rank_corr',0) <= 0: raise SystemExit('FAIL: no positive within-GW ranking skill')
          if r.get('top5_delta',0) < 0: raise SystemExit('FAIL: v2 top-5 decisions trail baseline')
          bad=[]
          for s,m in r.get('by_season',{}).items():
            if m.get('mae_improvement_pct',0) < -2: bad.append((s,m.get('mae_improvement_pct')))
          if bad: raise SystemExit(f'FAIL: material season regression {bad}')
          print('PASS: model clears promotion gate')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-v2-backtest
          path: |
            backtest_results.json
            backtest_dataset.json
