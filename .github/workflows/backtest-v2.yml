name: Model v2 backtest
on:
  workflow_dispatch:
  push:
    branches: [model-v2]
    paths:
      - 'model_v2_core.py'
      - 'backtest.py'
      - 'build_backtest_dataset.py'
      - 'calibrate_v2.py'
      - '.github/workflows/backtest-v2.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build leakage-safe historical dataset
        run: python build_backtest_dataset.py --seasons 2023-24 2024-25 2025-26 --out backtest_dataset.json
      - name: Evaluate raw v2
        run: python backtest.py backtest_dataset.json --out backtest_results_raw.json
      - name: Fit train-only positional calibration
        run: python calibrate_v2.py backtest_dataset.json --out backtest_dataset_calibrated.json --params calibration_params.json
      - name: Evaluate calibrated v2
        run: python backtest.py backtest_dataset_calibrated.json --out backtest_results.json
      - name: Build compact calibration report
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          r=json.load(open('backtest_results.json')); raw=json.load(open('backtest_results_raw.json'));h=r.get('holdout',{});hr=raw.get('holdout',{})
          report={
            'generated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'dataset_sha256':r.get('dataset_sha256'),'rows':r.get('n'),'gameweeks':r.get('evaluated_gameweeks'),'holdout_season':r.get('holdout_season'),
            'raw_holdout':{k:hr.get(k) for k in ('n','mae','baseline_mae','mae_improvement_pct','within_gw_rank_corr','captain_delta','top5_delta')},
            'calibrated_holdout':{k:h.get(k) for k in ('n','mae','baseline_mae','mae_improvement_pct','within_gw_rank_corr','captain_delta','top5_delta')},
            'calibrated_holdout_by_position':h.get('by_position',{}),'calibrated_holdout_quintiles':h.get('calibration_quintiles',[]),
            'params':json.load(open('calibration_params.json'))
          }
          json.dump(report,open('model_v2_status.json','w'),indent=2)
          PY
      - name: Persist latest test results on model branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_results.json backtest_results_raw.json calibration_params.json model_v2_status.json
          if git diff --cached --quiet; then echo "No result changes to commit."; else git commit -m "Model v2: record calibrated walk-forward results" && git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-v2-backtest
          path: |
            backtest_results.json
            backtest_results_raw.json
            backtest_dataset.json
            backtest_dataset_calibrated.json
            calibration_params.json
            model_v2_status.json
      - name: Show strict promotion quality gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('backtest_results.json'));raw=json.load(open('backtest_results_raw.json'));h=r.get('holdout',{});hr=raw.get('holdout',{})
          print('Rows:',r['n'],'Evaluated GWs:',r.get('evaluated_gameweeks'),'Holdout:',r.get('holdout_season'))
          print('Raw holdout MAE:',round(hr.get('mae',999),4),'Calibrated:',round(h.get('mae',999),4),'Baseline:',round(h.get('baseline_mae',999),4))
          print('Calibrated holdout improvement %:',round(h.get('mae_improvement_pct',-999),2),'Rank:',round(h.get('within_gw_rank_corr',0),4),'Captain delta:',h.get('captain_delta'),'Top5:',round(h.get('top5_delta',0),2))
          print('Position metrics:',h.get('by_position',{}))
          if r['n'] < 5000: raise SystemExit('FAIL: insufficient evaluation sample')
          if r.get('evaluated_gameweeks',0) < 75: raise SystemExit('FAIL: insufficient walk-forward gameweeks')
          if h.get('n',0) < 1500: raise SystemExit('FAIL: holdout sample too small')
          if h.get('mae',999) >= h.get('baseline_mae',999): raise SystemExit('FAIL: calibrated v2 does not beat baseline on holdout MAE')
          if h.get('mae',999) > hr.get('mae',999)+0.01: raise SystemExit('FAIL: calibration materially worsens raw v2 holdout MAE')
          if h.get('within_gw_rank_corr',0) <= 0: raise SystemExit('FAIL: no positive holdout ranking skill')
          if h.get('top5_delta',0) < 0: raise SystemExit('FAIL: holdout top-5 decisions trail baseline')
          bad=[(pos,m.get('mae_improvement_pct')) for pos,m in h.get('by_position',{}).items() if m.get('mae_improvement_pct',0)<-3]
          if bad: raise SystemExit(f'FAIL: material holdout position regression {bad}')
          print('PASS: calibrated model clears strict holdout promotion gate')
          PY
