name: Model v2 backtest
on:
  workflow_dispatch:
  push:
    branches: [model-v2]
    paths:
      - 'model_v2_core.py'
      - 'team_strength_v2.py'
      - 'player_form_v2.py'
      - 'generate_dashboard.py'
      - 'backtest.py'
      - 'build_backtest_dataset.py'
      - 'calibrate_v2.py'
      - 'captain_model_v2.py'
      - 'uncertainty_backtest_v2.py'
      - 'upside_tuning_v2.py'
      - 'transfer_optimizer_v2.py'
      - 'transfer_backtest_v2.py'
      - 'tune_transfer_strategy_v2.py'
      - 'test_transfer_optimizer_v2.py'
      - '.github/workflows/backtest-v2.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Stress-test transfer optimizer
        run: python test_transfer_optimizer_v2.py
      - name: Build leakage-safe historical dataset
        run: python build_backtest_dataset.py --seasons 2023-24 2024-25 2025-26 --out backtest_dataset.json
      - name: Validate predictive uncertainty on untouched holdout
        run: python uncertainty_backtest_v2.py backtest_dataset.json --out uncertainty_status.json
      - name: Tune upside weighting on training seasons only
        run: python upside_tuning_v2.py backtest_dataset.json --out upside_tuning_status.json
      - name: Evaluate raw v2
        run: python backtest.py backtest_dataset.json --out backtest_results_raw.json
      - name: Fit train-only positional calibration
        run: python calibrate_v2.py backtest_dataset.json --out backtest_dataset_calibrated.json --params calibration_params.json
      - name: Evaluate calibrated v2
        run: python backtest.py backtest_dataset_calibrated.json --out backtest_results.json
      - name: Train/test captain optimizer without holdout leakage
        run: python captain_model_v2.py backtest_dataset_calibrated.json --out captain_model_status.json
      - name: Tune planning horizon on training seasons only
        run: python tune_transfer_strategy_v2.py backtest_dataset_calibrated.json --out transfer_strategy_params.json
      - name: Validate multi-GW signal on holdout
        run: python transfer_backtest_v2.py backtest_dataset_calibrated.json --out transfer_backtest_status.json
      - name: Build compact model report
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          r=json.load(open('backtest_results.json'));raw=json.load(open('backtest_results_raw.json'));cap=json.load(open('captain_model_status.json'));tr=json.load(open('transfer_backtest_status.json'));tp=json.load(open('transfer_strategy_params.json'));u=json.load(open('uncertainty_status.json'));up=json.load(open('upside_tuning_status.json'));h=r.get('holdout',{});hr=raw.get('holdout',{})
          report={'generated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),'model_version':'2.6-underlying-form','dataset_sha256':r.get('dataset_sha256'),'rows':r.get('n'),'gameweeks':r.get('evaluated_gameweeks'),'holdout_season':r.get('holdout_season'),'raw_holdout':{k:hr.get(k) for k in ('n','mae','baseline_mae','mae_improvement_pct','within_gw_rank_corr','captain_delta','top5_delta')},'calibrated_holdout':{k:h.get(k) for k in ('n','mae','baseline_mae','mae_improvement_pct','within_gw_rank_corr','captain_delta','top5_delta')},'calibrated_holdout_by_position':h.get('by_position',{}),'calibration_params':json.load(open('calibration_params.json')),'uncertainty':u,'upside_tuning':up,'captain_model':cap,'transfer_strategy':tr,'transfer_tuning':tp,'team_strength_engine':'dynamic recency-weighted home/away ratings','player_form_engine':'shrunk xGI/90 + Threat + Creativity + Influence'}
          json.dump(report,open('model_v2_status.json','w'),indent=2)
          PY
      - name: Persist latest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_results.json backtest_results_raw.json calibration_params.json uncertainty_status.json upside_tuning_status.json captain_model_status.json transfer_backtest_status.json transfer_strategy_params.json model_v2_status.json
          if git diff --cached --quiet; then echo "No result changes."; else git commit -m "Model v2.6: record validation suite" && git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-v2-backtest
          path: |
            backtest_results.json
            backtest_results_raw.json
            calibration_params.json
            uncertainty_status.json
            upside_tuning_status.json
            captain_model_status.json
            transfer_backtest_status.json
            transfer_strategy_params.json
            model_v2_status.json
      - name: Strict promotion gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('backtest_results.json'));raw=json.load(open('backtest_results_raw.json'));tr=json.load(open('transfer_backtest_status.json'));tp=json.load(open('transfer_strategy_params.json'));u=json.load(open('uncertainty_status.json'));h=r.get('holdout',{});hr=raw.get('holdout',{})
          if r['n'] < 5000 or r.get('evaluated_gameweeks',0)<75: raise SystemExit('FAIL: sample too small')
          if h.get('mae',999)>=h.get('baseline_mae',999): raise SystemExit('FAIL: xP holdout MAE')
          if h.get('mae',999)>hr.get('mae',999)+0.01: raise SystemExit('FAIL: calibration worsens raw model')
          if h.get('within_gw_rank_corr',0)<=0 or h.get('top5_delta',0)<0: raise SystemExit('FAIL: ranking quality')
          if not u.get('valid'): raise SystemExit('FAIL: predictive intervals')
          if not tr.get('valid') or not tr.get('promote'): raise SystemExit('FAIL: multi-GW transfer holdout')
          if not tp.get('promote'): raise SystemExit('FAIL: tuned horizon')
          print('PASS v2.6 validation suite')
          PY
