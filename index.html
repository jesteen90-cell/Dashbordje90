<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPL Autopilot</title><style>:root{--bg:#080214;--panel:#110922;--line:#ffffff1a;--txt:#fff;--muted:#aaa3bd;--green:#00f28f;--red:#ff5b78}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#35106a,transparent 28%),linear-gradient(#080214,#13092b 55%,#080214);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:900px;margin:auto;padding:20px 14px 80px}.head{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#c8bddc;font-weight:900}.title{font-size:30px;font-weight:950}.chip{border:1px solid var(--line);border-radius:99px;padding:7px 10px;background:#ffffff0b}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 8px}.pitch{position:relative;min-height:520px;border-radius:28px;overflow:hidden;padding:20px 4px 14px;border:1px solid #70ffbb52;background:repeating-linear-gradient(90deg,#07854d 0 12.5%,#087b48 12.5% 25%);display:flex;flex-direction:column;justify-content:space-around}.pitch:before{content:"";position:absolute;inset:7% 6%;border:1px solid #ffffff45}.pitch:after{content:"";position:absolute;left:6%;right:6%;top:50%;border-top:1px solid #ffffff45}.row{position:relative;z-index:2;display:flex;justify-content:space-evenly;align-items:flex-start}.player{width:24%;max-width:110px;text-align:center;padding:7px 3px;border:2px solid transparent;border-radius:16px}.player.out{border-color:var(--red);background:#ff5b7818;box-shadow:0 0 0 2px #ff5b7828,0 0 24px #ff5b7848}.player.in{border-color:var(--green);background:#00f28f16;box-shadow:0 0 0 2px #00f28f28,0 0 24px #00f28f48}.tag{font-size:8px;font-weight:950;letter-spacing:.1em}.out .tag{color:#ffd4dd}.in .tag{color:#caffea}.kitWrap{perspective:180px;height:61px;display:flex;align-items:flex-start;justify-content:center}.kit{--body:#777;--accent:#fff;--pattern:none;position:relative;width:62px;height:54px;transform:rotateX(7deg);filter:drop-shadow(0 9px 6px #0008)}.torso{position:absolute;left:13px;top:4px;width:36px;height:48px;background:var(--pattern),linear-gradient(90deg,#0003,transparent 18%,#fff2 45%,transparent 70%,#0004),var(--body);clip-path:polygon(18% 0,82% 0,100% 14%,90% 100%,10% 100%,0 14%);border-radius:3px}.sleeve{position:absolute;top:7px;width:20px;height:22px;background:linear-gradient(140deg,#fff2,transparent 45%,#0004),var(--accent);z-index:-1}.sl{left:1px;clip-path:polygon(45% 0,100% 20%,72% 100%,0 62%)}.sr{right:1px;clip-path:polygon(0 20%,55% 0,100% 62%,28% 100%)}.collar{position:absolute;left:24px;top:1px;width:14px;height:8px;border:3px solid var(--accent);border-top:0;border-radius:0 0 8px 8px;z-index:3;filter:drop-shadow(0 1px 1px #0005)}.fold{position:absolute;inset:4px 13px 2px;clip-path:polygon(18% 0,82% 0,100% 14%,90% 100%,10% 100%,0 14%);background:linear-gradient(105deg,#0005 0 8%,transparent 20% 42%,#fff4 50%,transparent 58% 78%,#0005 92%);mix-blend-mode:soft-light}.badge{position:absolute;left:20px;top:15px;width:7px;height:7px;border-radius:50%;background:#ffffffcc;box-shadow:0 0 0 1px #0004}.capt{position:absolute;right:-7px;top:-5px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#18072c;border:2px solid var(--green);font-size:10px;font-weight:950;z-index:5}.name{display:inline-block;max-width:100%;padding:3px 7px;border-radius:7px;background:#fff;color:#170d23;font-size:10px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 7px #0004}.xp,.fix{display:block;text-shadow:0 1px 2px #000}.xp{font-size:10px;font-weight:800;margin-top:3px}.fix{font-size:8.5px;color:#e7fff3}.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin:6px 2px 10px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.r{background:var(--red)}.g{background:var(--green)}@media(max-width:390px){.pitch{min-height:490px}.kit{transform:scale(.9) rotateX(7deg)}.name{font-size:9px}}</style></head><body><main class="app"><div class="head"><div><div class="brand">FPL AUTOPILOT · LIVE</div><div class="title">3D Kit View</div><div id="meta" style="color:var(--muted)">Laster…</div></div><div class="chip">LIVE</div></div><section class="section"><h2>Min nåværende startellever</h2><div id="current" class="pitch"></div></section><section class="section"><h2>Startellever med beste bytte</h2><div class="legend"><span><i class="dot r"></i>Spiller ut</span><span><i class="dot g"></i>Spiller inn</span></div><div id="after" class="pitch"></div></section></main><script>const K={Arsenal:{b:'#d91528',a:'#f5f5f5',p:'linear-gradient(135deg,transparent 0 42%,#ffffff13 42% 48%,transparent 48% 100%)'},'Man Utd':{b:'#d71920',a:'#111'},'Man City':{b:'#76bfe7',a:'#fff'},Chelsea:{b:'#034694',a:'#d8b44c',p:'repeating-linear-gradient(135deg,#ffffff0b 0 4px,transparent 4px 9px)'},Liverpool:{b:'#c8102e',a:'#f2e7d5',p:'repeating-linear-gradient(135deg,#ffffff10 0 3px,transparent 3px 8px)'},Newcastle:{b:'repeating-linear-gradient(90deg,#111 0 10px,#fff 10px 20px)',a:'#111'},Spurs:{b:'#f7f7f7',a:'#132257'},Brighton:{b:'repeating-linear-gradient(90deg,#0756a4 0 10px,#fff 10px 20px)',a:'#0756a4'},'Aston Villa':{b:'#7a003c',a:'#95d8f4'},'West Ham':{b:'#7a263a',a:'#69b3e7'},'Crystal Palace':{b:'repeating-linear-gradient(90deg,#1b458f 0 9px,#c4122e 9px 18px)',a:'#f2d13d'},Brentford:{b:'repeating-linear-gradient(90deg,#e30613 0 9px,#fff 9px 18px)',a:'#111'},Bournemouth:{b:'repeating-linear-gradient(90deg,#d71920 0 9px,#111 9px 18px)',a:'#111'},Everton:{b:'#003399',a:'#fff'},Fulham:{b:'#f7f7f7',a:'#111'},'Coventry City':{b:'#72c7ef',a:'#fff'},'Hull City':{b:'repeating-linear-gradient(90deg,#f4a900 0 11px,#111 11px 22px)',a:'#111'},'Ipswich Town':{b:'#1b55a8',a:'#fff'},"Nott'm Forest":{b:'#e53233',a:'#fff'},Wolves:{b:'#fdb913',a:'#111'}};function sty(p){let k=K[p.team]||{b:'#7b2cff',a:'#fff'};return `--body:${k.b};--accent:${k.a};--pattern:${k.p||'none'}`}function card(p,change){let t=p.captain?'C':p.vice?'V':'';return `<div class="player ${change||''}">${change?`<div class="tag">${change==='out'?'UT':'INN'}</div>`:''}<div class="kitWrap"><div class="kit" style="${sty(p)}"><div class="sleeve sl"></div><div class="sleeve sr"></div><div class="torso"></div><div class="collar"></div><div class="fold"></div><div class="badge"></div>${t?`<div class="capt">${t}</div>`:''}</div></div><span class="name">${p.name}</span><span class="xp">${Number(p.xp||0).toFixed(2)} poeng</span><span class="fix">${p.fixture||''}</span></div>`}function pitch(xs,outs=new Set(),ins=new Set()){return ['FWD','MID','DEF','GK'].map(pos=>`<div class="row">${xs.filter(x=>x.position===pos).map(x=>card(x,outs.has(x.id)?'out':ins.has(x.id)?'in':'' )).join('')}</div>`).join('')}async function run(){let r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'}),d=await r.json();document.querySelector('#meta').textContent=`GW${d.gw} · ${new Intl.DateTimeFormat('nb-NO',{timeZone:'Europe/Oslo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(d.generated_at))} norsk tid`;let cur=d.comparison?.current_xi||d.lineup||[];let aft=d.comparison?.transfer_xi||d.lineup||[];let outs=new Set((d.comparison?.changes||d.recommendation?.transfers||[]).map(x=>x.out.id));let ins=new Set((d.comparison?.changes||d.recommendation?.transfers||[]).map(x=>x.in.id));document.querySelector('#current').innerHTML=pitch(cur,outs,new Set());document.querySelector('#after').innerHTML=pitch(aft,new Set(),ins)}run()</script></body></html>
