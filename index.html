<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080311"><title>FPL Autopilot</title><style>
:root{--bg:#080311;--panel:#140b22;--line:#ffffff18;--txt:#fff;--muted:#aaa2ba;--green:#18eda0;--red:#ff496b;--yellow:#ffd45b;--purple:#8b4cff}*{box-sizing:border-box}body{margin:0;color:var(--txt);font:14px/1.45 system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 85% -10%,#6621a8 0,transparent 30%),radial-gradient(circle at -10% 45%,#142c5c55,transparent 35%),linear-gradient(180deg,#080311,#11071e 58%,#080311);min-height:100vh}.app{max-width:900px;margin:auto;padding:18px 11px 90px}.head,.decisionTop,.planrow{display:flex;justify-content:space-between;gap:10px}.brand,.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:900;color:#cfc3e3}.title{font-size:30px;font-weight:950;letter-spacing:-.035em}.muted{color:var(--muted)}.live{height:max-content;padding:7px 11px;border-radius:99px;background:#18eda012;border:1px solid #18eda04f;color:#aaffdc;font-size:10px;font-weight:950;box-shadow:0 0 24px #18eda014}.hero{margin-top:15px;padding:18px;border-radius:25px;border:1px solid #ffffff1d;background:linear-gradient(145deg,#7027d650,#160c29 56%,#0b203a 140%);box-shadow:0 20px 55px #0005}.hero h1{margin:5px 0;font-size:28px;letter-spacing:-.025em}.heroInfo{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px;padding:11px 13px;border-radius:16px;border:1px solid #ffffff0d;background:#ffffff08}.count{font-size:20px;font-weight:950}.exact,.modelpill{font-size:10px}.modelpill{color:#9af7d0}.tabs{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 0;background:#080311e8;backdrop-filter:blur(16px)}.tab{border:1px solid var(--line);border-radius:14px;padding:10px 3px;background:#ffffff09;color:#d6cee2;font:850 12px system-ui}.tab.active{background:linear-gradient(135deg,#6930df,#a64cff);border-color:#b77cff66;color:#fff;box-shadow:0 7px 20px #6d27d72b}.panel{display:none}.panel.active{display:block}.section{margin-top:17px}.section h2{font-size:19px;margin:0 0 9px;letter-spacing:-.02em}.card,.decision{border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:9px;background:linear-gradient(145deg,#ffffff0e,#ffffff06);box-shadow:0 12px 35px #0002}.decisionWord{font-size:27px;font-weight:950}.badge,.status{font-size:10px;font-weight:950;padding:5px 9px;border-radius:99px}.go,.do{color:#bfffe3;background:#18eda019}.bank,.consider{color:#ffe39a;background:#ffd45b18}.weak{color:#ff9aaf;background:#ff668018}.meter{margin:16px 0 5px;position:relative;height:12px;border-radius:99px;background:linear-gradient(90deg,#ffd45b,#8a56ff 54%,#18eda0)}.needle{position:absolute;top:-5px;width:4px;height:22px;border-radius:3px;background:#fff;box-shadow:0 0 10px #fff}.meterLabels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.why{display:grid;gap:7px;margin-top:12px}.whyItem,.trigger{padding:10px 11px;border-radius:13px;border:1px solid #ffffff0b;background:#ffffff07;font-size:12px}.trigger{margin-top:10px}.miniStats,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.mini,.stat{text-align:center;padding:9px 3px;border-radius:12px;background:#ffffff08}.mini b,.stat b{display:block;font-size:15px}.mini span,.stat span{font-size:9px;color:var(--muted)}.captGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.captCard{position:relative;padding:13px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(145deg,#ffffff0c,#ffffff05)}.captCard.top{border-color:#18eda066;box-shadow:inset 0 0 0 1px #18eda018}.captRank{position:absolute;right:11px;font-size:18px;font-weight:950;color:#ffffff44}.captName{font-size:15px;font-weight:950}.captMeta,.planMeta{font-size:10px;color:var(--muted)}.captStats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.captStats div{text-align:center;background:#0002;border-radius:9px;padding:6px}.captStats b{display:block}.captStats span{font-size:8px;color:var(--muted)}
.pitch{position:relative;min-height:555px;border-radius:30px;overflow:hidden;padding:18px 2px 13px;border:1px solid #7dffc76b;background:repeating-linear-gradient(90deg,#087a49 0 12.5%,#087046 12.5% 25%);display:flex;flex-direction:column;justify-content:space-around;box-shadow:inset 0 0 60px #00281755,0 14px 35px #0003}.pitch:before{content:"";position:absolute;inset:6% 5%;border:1px solid #ffffff55;border-radius:2px}.pitch:after{content:"";position:absolute;left:5%;right:5%;top:50%;border-top:1px solid #ffffff55}.row{position:relative;z-index:2;display:flex;justify-content:space-evenly;width:100%}.player{position:relative;width:24%;max-width:114px;min-width:0;text-align:center;padding:5px 2px 4px;border:3px solid transparent;border-radius:19px;transition:.2s}.player.out{border-color:var(--red);background:#ff496b18;box-shadow:0 0 0 2px #4b0714,0 0 22px #ff496b99}.player.in{border-color:var(--green);background:#18eda014;box-shadow:0 0 0 2px #063d2a,0 0 22px #18eda077}.player.out:after,.player.in:after{position:absolute;right:-5px;top:-7px;padding:3px 6px;border-radius:99px;font-size:7px;font-weight:1000;letter-spacing:.05em;color:#fff}.player.out:after{content:'UT';background:var(--red)}.player.in:after{content:'INN';background:#00a96e}.tag{height:8px;font-size:0}.kitWrap{height:68px;display:flex;justify-content:center}.kit{position:relative;width:60px;height:62px;filter:drop-shadow(0 8px 5px #001c)}.shirt{position:absolute;left:5px;top:4px;width:50px;height:54px;clip-path:polygon(18% 0,34% 6%,66% 6%,82% 0,100% 15%,88% 33%,82% 100%,18% 100%,12% 33%,0 15%);background:var(--kit);border-radius:5px;overflow:hidden}.shirt:before{content:"";position:absolute;left:18px;top:0;width:14px;height:7px;border-radius:0 0 9px 9px;background:var(--collar)}.crest{position:absolute;left:12px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--crest);display:grid;place-items:center;color:#111;font-size:4px;font-weight:1000;box-shadow:0 0 0 1px #0005}.sponsor{position:absolute;left:10px;right:10px;top:31px;height:3px;border-radius:4px;background:var(--sponsor,#fff);opacity:.85}.clubMark{position:absolute;left:0;right:0;top:37px;text-align:center;font-size:5px;font-weight:1000;color:var(--mark,#fff);text-shadow:0 1px 1px #0008}.cap{position:absolute;right:-5px;top:-4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#170629;border:2px solid var(--green);font-size:9px;font-weight:950}.cap.v{border-color:#ddd2ef}.name{display:inline-flex;max-width:100%;padding:4px 6px;border-radius:9px;background:#f7f4fa;color:#160c22;font-size:9px;font-weight:950;line-height:1.05;justify-content:center;overflow-wrap:anywhere;box-shadow:0 3px 10px #0003}.pos{display:block;margin:3px auto 0;width:max-content;max-width:100%;padding:2px 6px;border-radius:99px;background:#110820e8;border:1px solid #ffffff2d;color:#fff;font-size:7px;font-weight:950;letter-spacing:.04em}.xp,.fix,.range{display:block;text-shadow:0 1px 2px #000}.xp{font-size:9px;font-weight:900;margin-top:3px}.fix{font-size:7.6px;color:#e9fff4}.range{font-size:6.8px;color:#d2cadb}.row.n5{justify-content:space-between}.row.n5 .player{width:20%;max-width:none;padding:2px 0}.row.n5 .kit{transform:scale(.70);transform-origin:top center}.row.n5 .kitWrap{height:47px}.row.n5 .name{font-size:7.3px;min-height:21px;padding:3px 1px}.row.n5 .pos{font-size:6.2px;padding:1px 3px}.row.n5 .xp{font-size:7.4px}.row.n5 .fix,.row.n5 .range{font-size:6px}.bench{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.benchCard{text-align:center;padding:8px 3px;border:1px solid #ffffff0c;border-radius:18px;background:#ffffff08}.benchCard .kit{transform:scale(.82);transform-origin:top center}.move{display:grid;grid-template-columns:1fr 30px 1fr;gap:8px;align-items:center;margin-top:9px}.swap{padding:11px;border-radius:14px;background:#ffffff08;min-width:0}.swap.outSwap{border:1px solid #ff496b55;background:#ff496b0c}.swap.inSwap{border:1px solid #18eda044;background:#18eda00b}.arrow{text-align:center;font-size:20px;color:#c7b7df}.footer{text-align:center;color:#746c84;font-size:10px;margin-top:22px}.error{display:none}.error.show{display:block}@media(max-width:430px){.app{padding-left:8px;padding-right:8px}.row.n5 .kit{transform:scale(.62)}.row.n5 .kitWrap{height:43px}.row.n5 .name{font-size:7px}.bench{grid-template-columns:repeat(2,1fr)}.captGrid{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="head"><div><div class="brand">FPL AUTOPILOT</div><div class="title">Command Center</div><div class="muted" id="meta">Laster data…</div></div><div class="live">LIVE</div></header><div id="error" class="error"></div><section class="hero"><div class="eyebrow">Min anbefaling akkurat nå</div><h1 id="headline">Laster…</h1><div class="muted" id="summary"></div><div class="heroInfo"><div><div class="eyebrow">Tid til neste frist</div><div class="count" id="countdown">—</div><div class="exact" id="deadlineExact">—</div><div class="modelpill" id="modelpill"></div></div><div><div class="eyebrow">Datagrunnlag</div><b id="snapshot">—</b></div></div></section><nav class="tabs"><button class="tab active" data-tab="decision">Beslutning</button><button class="tab" data-tab="team">Lag</button><button class="tab" data-tab="moves">Bytter</button><button class="tab" data-tab="plan">Plan</button></nav><section id="decision" class="panel active"><div class="section"><h2>Hvorfor?</h2><div id="decisionBox"></div></div><div class="section"><h2>Kapteinskampen</h2><div id="captains" class="captGrid"></div></div></section><section id="team" class="panel"><div class="section"><h2>Nåværende startellever</h2><div id="current" class="pitch"></div></div><div class="section"><h2>Startellever etter foreslått trekk</h2><div id="after" class="pitch"></div></div><div class="section"><h2>Benk</h2><div id="bench" class="bench"></div></div></section><section id="moves" class="panel"><div class="section"><h2>Beste bytteforslag</h2><div id="transfers"></div></div></section><section id="plan" class="panel"><div class="section"><h2>Plan fremover</h2><div id="future"></div></div></section><div class="footer">Automatiske analyser · norsk tid · Decision Layer</div></main><script>
const q=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let D;const P={GK:'KEEPER',DEF:'FORSVAR',MID:'MIDTBANE',FWD:'ANGREP'};
const K={Arsenal:['linear-gradient(90deg,#fff 0 20%,#d7192d 20% 80%,#fff 80%)','#fff','#d7192d','#fff','AFC'],"Aston Villa":['linear-gradient(90deg,#75b7df 0 18%,#7a1739 18% 82%,#75b7df 82%)','#75b7df','#f7d548','#75b7df','AV'],Bournemouth:['repeating-linear-gradient(90deg,#d71920 0 7px,#111 7px 14px)','#111','#fff','#fff','AFCB'],Brentford:['repeating-linear-gradient(90deg,#e31b23 0 8px,#fff 8px 16px)','#f3c928','#111','#111','BFC'],Brighton:['repeating-linear-gradient(90deg,#1262ad 0 10px,#fff 10px 12px)','#fff','#fff','#fff','BHA'],Chelsea:['#0748bd','#fff','#f0c52d','#fff','CFC'],"Crystal Palace":['repeating-linear-gradient(90deg,#164194 0 8px,#d92332 8px 16px)','#fff','#fff','#fff','CPFC'],Everton:['#0755b5','#fff','#fff','#fff','EFC'],Fulham:['linear-gradient(180deg,#fff 0 78%,#111 78%)','#111','#111','#111','FFC'],Leeds:['linear-gradient(180deg,#fff 0 82%,#f4d61f 82%)','#184a9c','#184a9c','#184a9c','LUFC'],Liverpool:['#c8102e','#f2e6cf','#f2e6cf','#f2e6cf','LFC'],"Man City":['#79c9ef','#fff','#fff','#fff','MCFC'],"Man Utd":['linear-gradient(180deg,#d71920 0 82%,#111 82%)','#111','#f6c500','#fff','MUFC'],Newcastle:['repeating-linear-gradient(90deg,#111 0 8px,#fff 8px 16px)','#111','#5da9dd','#fff','NUFC'],"Nott'm Forest":['#e52b35','#fff','#fff','#fff','NFFC'],Sunderland:['repeating-linear-gradient(90deg,#e51b2b 0 8px,#fff 8px 16px)','#111','#111','#111','SAFC'],Spurs:['linear-gradient(180deg,#fff 0 80%,#101b46 80%)','#101b46','#101b46','#101b46','THFC'],Wolves:['#fdb913','#111','#111','#111','WWFC'],Burnley:['linear-gradient(90deg,#6c1d45 0 80%,#7cc7e8 80%)','#7cc7e8','#fff','#fff','BFC']};
function kit(p){let k=K[p.team]||['#7440b7','#111','#fff','#fff','?'],c=p.captain?'<div class="cap">C</div>':p.vice?'<div class="cap v">V</div>':'';return `<div class="kitWrap"><div class="kit" style="--kit:${k[0]};--collar:${k[1]};--crest:${k[2]};--sponsor:${k[3]};--mark:${k[3]}"><div class="shirt"><span class="crest">${esc(k[4].slice(0,2))}</span><span class="sponsor"></span><span class="clubMark">${esc(k[4])}</span></div>${c}</div></div>`}function rangeText(p){return Number.isFinite(Number(p.xp_low))?`${Number(p.xp_low).toFixed(1)}–${Number(p.xp_high).toFixed(1)} · ${esc(p.risk||'')}`:''}function card(p,ch){return `<div class="player ${ch||''}"><div class="tag"></div>${kit(p)}<span class="name">${esc(p.name)}</span><span class="pos">${esc(P[p.position]||p.position||'')}</span><span class="xp">${Number(p.xp||0).toFixed(2)} xP</span><span class="fix">${esc(p.fixture||'')}</span><span class="range">${rangeText(p)}</span></div>`}function pitch(xs,outs=new Set(),ins=new Set()){return ['FWD','MID','DEF','GK'].map(pos=>{let ps=(xs||[]).filter(x=>x.position===pos);return `<div class="row n${ps.length}">${ps.map(x=>card(x,outs.has(+x.id)?'out':ins.has(+x.id)?'in':'')).join('')}</div>`}).join('')}function fmt(v){v=Number(v||0);return(v>=0?'+':'')+v.toFixed(2)}
function countdown(){if(!D?.deadline_time)return;let d=new Date(D.deadline_time),ms=d-Date.now();q('#deadlineExact').textContent=new Intl.DateTimeFormat('nb-NO',{timeZone:'Europe/Oslo',weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d)+' norsk tid';if(ms<=0){q('#countdown').textContent='Fristen er passert';return}let h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);q('#countdown').textContent=`${Math.floor(h/24)}d ${h%24}t ${m}m`}
function decisionHtml(){let e=D.decision_explanation||{},dl=D.decision_layer||{},gain=Number(e.weighted_gain||0),thr=Number(e.threshold||dl.threshold||1.15),pct=Math.max(0,Math.min(100,(gain+1)/(Math.max(2.5,thr+1)+1)*100)),go=e.decision==='BYTT';return `<div class="decision"><div class="decisionTop"><div><div class="eyebrow">Robust beslutning</div><div class="decisionWord">${esc(e.decision||D.headline||'—')}</div></div><span class="badge ${go?'go':'bank'}">${go?'GODKJENT':'VENT'}</span></div><div class="meter"><i class="needle" style="left:${pct}%"></i></div><div class="meterLabels"><span>BANK</span><span>terskel ${thr.toFixed(2)}</span><span>BYTT</span></div><div class="miniStats"><div class="mini"><b>${fmt(e.horizon_3gw)}</b><span>3 GW</span></div><div class="mini"><b>${fmt(e.horizon_plan)}</b><span>plan</span></div><div class="mini"><b>${fmt(gain)}</b><span>netto</span></div></div><div class="why">${(e.why||[]).map(x=>`<div class="whyItem">${esc(x)}</div>`).join('')}</div><div class="trigger"><b>Hva får den til å snu?</b><br>${esc(e.switch_trigger||'Modellen beregnes på nytt når data endrer seg.')}</div></div>`}
function captainHtml(){let xs=D.captain_comparison||[];return xs.map((p,i)=>`<div class="captCard ${i===0?'top':''}"><div class="captRank">#${i+1}</div><div class="captName">${esc(p.name)}</div><div class="captMeta">${esc(p.team||'')} · ${esc(P[p.position]||p.position||'')}</div><div class="captStats"><div><b>${Number(p.xp||0).toFixed(2)}</b><span>xP</span></div><div><b>${Number(p.ceiling||0).toFixed(2)}</b><span>tak</span></div><div><b>${Number(p.expected_minutes||0).toFixed(0)}</b><span>min</span></div></div></div>`).join('')||'<div class="card muted">Ingen kapteinsdata.</div>'}
function transferHtml(c,i){let pairs=c.pairs||[],s=c.status||'',cls=s.includes('GJØR')?'do':s==='VURDERES'?'consider':'weak';if(!pairs.length)return'';return `<article class="card"><div class="planrow"><b>#${i+1}</b><span class="status ${cls}">${esc(s)}</span></div>${pairs.map(x=>`<div class="move"><div class="swap outSwap"><b>${esc(x.out.name)}</b><div class="muted">UT · ${esc(P[x.out.position]||x.out.position||'')} · ${Number(x.out.xp||0).toFixed(2)} xP</div></div><div class="arrow">→</div><div class="swap inSwap"><b>${esc(x.in.name)}</b><div class="muted">INN · ${esc(P[x.in.position]||x.in.position||'')} · ${Number(x.in.xp||0).toFixed(2)} xP</div></div></div>`).join('')}<div class="stats"><div class="stat"><b>${fmt(c.short_gain)}</b><span>3 GW</span></div><div class="stat"><b>${fmt(c.horizon_gain)}</b><span>plan</span></div><div class="stat"><b>${fmt(c.edge)}</b><span>edge</span></div></div></article>`}
function planHtml(x){let a=x.action||{};return `<article class="card"><div class="planrow"><div><div class="eyebrow">GW ${x.gw}</div><b>${esc(a.label||'Ingen handling')}</b></div><b>${Number(x.xi_xp||0).toFixed(1)} xP</b></div><div class="planMeta">Kaptein: ${esc(x.captain||'—')}</div></article>`}
function render(){let cmp=D.comparison||{},cur=cmp.current_xi||D.lineup||[],aft=cmp.transfer_xi||D.lineup||cur,changes=cmp.changes||[];if(!changes.length&&D.candidates?.[0]?.pairs)changes=D.candidates[0].pairs;let outs=new Set(changes.map(x=>+x.out?.id).filter(Boolean)),ins=new Set(changes.map(x=>+x.in?.id).filter(Boolean));q('#headline').textContent=D.headline||'Ingen anbefaling';q('#summary').textContent=D.summary||'';q('#meta').textContent=`GW${D.gw||'—'} · oppdatert ${D.generated_at?new Intl.DateTimeFormat('nb-NO',{timeZone:'Europe/Oslo',hour:'2-digit',minute:'2-digit'}).format(new Date(D.generated_at)):'—'}`;q('#snapshot').textContent=D.source_snapshot_gw?`Lag etter GW${D.source_snapshot_gw}`:'FPL-data';q('#modelpill').textContent=`✓ ${D.decision_layer?.version||D.model_version||''}`;q('#decisionBox').innerHTML=decisionHtml();q('#captains').innerHTML=captainHtml();q('#current').innerHTML=pitch(cur,outs,new Set());q('#after').innerHTML=pitch(aft,new Set(),ins);q('#bench').innerHTML=(D.bench||[]).map(p=>`<div class="benchCard">${kit(p)}<span class="name">${esc(p.name)}</span><span class="pos">${esc(P[p.position]||p.position||'')}</span><span class="xp">${Number(p.xp||0).toFixed(2)} xP</span></div>`).join('');q('#transfers').innerHTML=(D.candidates||[]).map(transferHtml).join('')||'<div class="card muted">Ingen aktuelle bytter.</div>';q('#future').innerHTML=(D.future||[]).map(planHtml).join('');countdown()}
async function load(){try{let r=await fetch(`data.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error();D=await r.json();render();setInterval(countdown,30000)}catch(e){q('#error').classList.add('show');q('#error').textContent='Kunne ikke laste data.'}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');q('#'+b.dataset.tab).classList.add('active')});load();</script></body></html>
