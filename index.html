<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090318"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>FPL Autopilot</title><style>:root{--bg:#090318;--bg2:#12092a;--card:rgba(24,16,48,.82);--card2:#16102d;--line:rgba(255,255,255,.10);--text:#f8f7ff;--muted:#a9a3bd;--purple:#7b3cff;--purple2:#b96cff;--green:#00ef8b;--yellow:#ffd05a;--red:#ff6b82;--shadow:0 18px 50px rgba(0,0,0,.28)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 90% -10%,rgba(123,60,255,.42),transparent 32%),radial-gradient(circle at 0 20%,rgba(0,239,139,.10),transparent 28%),linear-gradient(180deg,var(--bg),var(--bg2) 60%,#080312);min-height:100vh}.app{max-width:880px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(98px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#bdb4da;font-weight:800}.title{font-size:30px;font-weight:900;letter-spacing:-.03em}.muted{color:var(--muted)}.live{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.055);font-size:11px;font-weight:750}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green)}.hero{margin-top:16px;padding:18px;border-radius:24px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(145deg,rgba(123,60,255,.28),rgba(17,11,36,.92) 56%),radial-gradient(circle at 100% 0,rgba(0,239,139,.18),transparent 30%);box-shadow:var(--shadow)}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#bdb4d2;font-weight:800}.hero h1{margin:6px 0 3px;font-size:29px;letter-spacing:-.03em}.good{color:var(--green)}.watch{color:var(--yellow)}.bad{color:var(--red)}.heroSwap{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:center;margin-top:14px}.swapBox,.card,.transfer,.mini{border:1px solid var(--line);background:rgba(11,7,26,.56);border-radius:16px}.swapBox{padding:11px}.swapBox b{font-size:17px}.arrow{text-align:center;font-size:22px;color:#c9c1da}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{text-align:center;padding:9px;border-radius:13px;background:rgba(255,255,255,.055)}.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:var(--muted)}.deadline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:11px;padding:12px 14px;border-radius:17px;background:rgba(255,255,255,.045);border:1px solid var(--line)}.count{font-size:21px;font-weight:900;letter-spacing:-.02em}.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px 0;margin-top:9px;background:linear-gradient(180deg,rgba(9,3,24,.98),rgba(9,3,24,.86),transparent);backdrop-filter:blur(14px)}.tab{border:1px solid var(--line);border-radius:13px;padding:10px 6px;background:rgba(255,255,255,.045);color:#d1cadf;font-weight:800}.tab.active{color:white;background:linear-gradient(135deg,var(--purple),#9c4cff);border-color:transparent;box-shadow:0 8px 22px rgba(123,60,255,.28)}.panel{display:none}.panel.active{display:block}.sectionTitle{font-size:18px;font-weight:850;margin:11px 2px 7px}.pitch{position:relative;min-height:550px;margin-top:9px;padding:17px 10px;border-radius:26px;background:linear-gradient(180deg,#0b633d,#064a2e);border:1px solid rgba(106,255,184,.36);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-around}.pitch:before{content:"";position:absolute;inset:7%;border:1px solid rgba(255,255,255,.24);border-radius:3px}.pitch:after{content:"";position:absolute;left:7%;right:7%;top:50%;border-top:1px solid rgba(255,255,255,.24)}.row{position:relative;z-index:1;display:flex;justify-content:center;gap:7px}.player{width:min(21vw,104px);min-width:70px;padding:8px 4px;text-align:center;border-radius:13px;background:linear-gradient(180deg,rgba(20,10,42,.94),rgba(10,7,24,.94));border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 20px rgba(0,0,0,.18)}.player b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player small{display:block;color:#cec6dd;font-size:9px;margin-top:2px}.badge{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;font-size:9px;background:var(--purple);margin-left:2px}.bench{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.mini{padding:9px;text-align:center}.mini b{display:block;font-size:11px}.mini span{font-size:9px;color:var(--muted)}.transfer{margin-top:9px;padding:14px;box-shadow:0 9px 28px rgba(0,0,0,.15)}.transferHead{display:flex;justify-content:space-between;align-items:center}.status{font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px}.status.do{color:var(--green);background:rgba(0,239,139,.11)}.status.consider{color:var(--yellow);background:rgba(255,208,90,.10)}.status.weak{color:#ff9cad;background:rgba(255,107,130,.10)}.move{display:grid;grid-template-columns:1fr 32px 1fr;gap:8px;align-items:center;margin-top:10px}.move .swapBox b{font-size:15px}.reason{margin-top:9px;padding:10px;border-left:3px solid var(--purple);background:rgba(123,60,255,.08);border-radius:0 10px 10px 0;font-size:12px;color:#c9c2d8}.future{display:grid;gap:8px}.gwcard{padding:14px;border-radius:17px;border:1px solid var(--line);background:var(--card)}.gwtop{display:flex;justify-content:space-between;gap:8px}.gwcard h3{margin:3px 0}.footer{text-align:center;color:#746d88;font-size:10px;margin-top:18px}.loading{padding:40px;text-align:center;color:var(--muted)}@media(min-width:700px){.pitch{min-height:620px}.player{width:105px}.bench{max-width:600px}.hero{padding:22px}}</style></head><body><main class="app"><header class="top"><div><div class="brand">FPL AUTOPILOT</div><div class="title">Command Center</div><div class="muted" id="updated">Laster analyse…</div></div><div class="live"><i class="dot"></i> AUTO</div></header><section class="hero"><div class="eyebrow">Hva bør jeg gjøre nå?</div><h1 id="headline">Laster…</h1><div class="muted" id="summary"></div><div id="heroMove"></div><div class="deadline"><div><div class="eyebrow">Neste deadline</div><div class="count" id="countdown">—</div></div><div style="text-align:right"><div class="eyebrow">Datagrunnlag</div><b id="snapshot">—</b></div></div></section><nav class="tabs"><button class="tab active" data-tab="team">Mitt lag</button><button class="tab" data-tab="moves">Bytter</button><button class="tab" data-tab="plan">Plan</button></nav><section id="team" class="panel active"><div class="sectionTitle">Anbefalt startellever</div><div class="pitch" id="pitch"><div class="loading">Laster lag…</div></div><div class="sectionTitle">Benk</div><div class="bench" id="bench"></div></section><section id="moves" class="panel"><div class="sectionTitle">Rangerte bytter</div><div id="transfers"></div></section><section id="plan" class="panel"><div class="sectionTitle">Plan fremover</div><div class="future" id="future"></div></section><div class="footer">Kun spill- og analysedata publiseres her. Ingen lag-ID, konto-, auth- eller persondata.</div></main><script>const q=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let D;function statusClass(s){return s==='GJØR DET'?'do':s==='VURDERES'?'consider':'weak'}function fmt(v){return (Number(v)>=0?'+':'')+Number(v).toFixed(2)}function countdown(){if(!D?.deadline_time){q('#countdown').textContent='Ikke satt';return}let ms=new Date(D.deadline_time)-new Date;if(ms<=0){q('#countdown').textContent='Passert';return}let h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);q('#countdown').textContent=`${Math.floor(h/24)}d ${h%24}t ${m}m`}function pCard(p){return `<div class="player"><b>${esc(p.name)}${p.captain?' <span class="badge">C</span>':''}${p.vice?' <span class="badge">V</span>':''}</b><small>${Number(p.xp).toFixed(2)} xP · ${esc(p.fixture)}</small></div>`}function renderPitch(xs){return ['FWD','MID','DEF','GK'].map(pos=>`<div class="row">${xs.filter(x=>x.position===pos).map(pCard).join('')}</div>`).join('')}function transfer(c,i){let x=c.pairs[0];let reason=c.gate_misses?.length?`Mangler: ${esc(c.gate_misses.join(' · '))}`:`Modellen liker totalgevinsten over både kort og lengre horisont.`;return `<article class="transfer"><div class="transferHead"><b>#${i+1}</b><span class="status ${statusClass(c.status)}">${esc(c.status)}</span></div><div class="move"><div class="swapBox"><div class="eyebrow">UT</div><b>${esc(x.out.name)}</b><div class="muted">${x.out.xp.toFixed(2)} xP</div></div><div class="arrow">→</div><div class="swapBox"><div class="eyebrow">INN</div><b>${esc(x.in.name)}</b><div class="muted">${x.in.xp.toFixed(2)} xP</div></div></div><div class="stats"><div class="stat"><b>${fmt(c.edge)}</b><span>edge</span></div><div class="stat"><b>${fmt(c.short_gain)}</b><span>3 GW</span></div><div class="stat"><b>${fmt(c.horizon_gain)}</b><span>horisont</span></div></div><div class="reason">${reason}</div></article>`}async function load(){let r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'});D=await r.json();q('#updated').textContent='Sist analysert '+new Date(D.generated_at).toLocaleString('nb-NO');q('#headline').textContent=D.headline;q('#headline').className=D.headline.includes('GJØR')?'good':'watch';q('#summary').textContent=D.summary;q('#snapshot').textContent=`GW${D.source_snapshot_gw} → GW${D.gw}`;if(D.recommendation?.transfers?.length){let x=D.recommendation.transfers[0];q('#heroMove').innerHTML=`<div class="heroSwap"><div class="swapBox"><div class="eyebrow">UT</div><b>${esc(x.out.name)}</b></div><div class="arrow">→</div><div class="swapBox"><div class="eyebrow">INN</div><b>${esc(x.in.name)}</b></div></div><div class="stats"><div class="stat"><b>${fmt(D.recommendation.edge)}</b><span>modell-edge</span></div><div class="stat"><b>0</b><span>hit</span></div><div class="stat"><b>GW${D.gw}</b><span>mål</span></div></div>`}else q('#heroMove').innerHTML='<div class="reason">Ingen transfer passerer terskelen nå. Bank transfer og overvåk videre.</div>';q('#pitch').innerHTML=renderPitch(D.lineup||[]);q('#bench').innerHTML=(D.bench||[]).map(p=>`<div class="mini"><b>${esc(p.name)}</b><span>${p.xp.toFixed(2)} xP</span></div>`).join('');q('#transfers').innerHTML=(D.candidates||[]).map(transfer).join('')||'<div class="card">Ingen aktuelle bytter akkurat nå.</div>';q('#future').innerHTML=(D.future||[]).map(x=>`<div class="gwcard"><div class="gwtop"><div><div class="eyebrow">GAMEWEEK ${x.gw}</div><h3>${esc(x.captain)} ©</h3></div><div style="text-align:right"><b>${Number(x.xi_xp).toFixed(1)}</b><div class="muted">XI xP</div></div></div><div class="muted">Kaptein xP ${Number(x.captain_xp).toFixed(2)}</div></div>`).join('');countdown()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');q('#'+b.dataset.tab).classList.add('active')});setInterval(countdown,30000);load().catch(e=>{q('#headline').textContent='Kunne ikke laste dashboard';q('#summary').textContent=e.message});</script></body></html>
