<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080214"><meta name="apple-mobile-web-app-capable" content="yes"><title>FPL Autopilot</title><style>:root{--bg:#080214;--card:#17102d;--line:rgba(255,255,255,.11);--text:#faf8ff;--muted:#aaa3bd;--purple:#7b2cff;--green:#00f28f;--yellow:#ffd34f;--red:#ff6680;--shadow:0 18px 48px rgba(0,0,0,.3)}*{box-sizing:border-box}body{margin:0;color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 100% 0,#35106a 0,transparent 27%),radial-gradient(circle at 0 18%,rgba(0,242,143,.1),transparent 25%),linear-gradient(#080214,#120827 58%,#080214);min-height:100vh}.app{max-width:900px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(95px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:12px}.brand,.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:#c3bad8}.title{font-size:31px;font-weight:950;letter-spacing:-.04em}.muted{color:var(--muted)}.live{height:max-content;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#ffffff0b;font-size:11px;font-weight:850}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green);margin-right:6px}.hero{margin-top:16px;padding:18px;border-radius:25px;border:1px solid #ffffff20;background:linear-gradient(145deg,#7024e54d,#100922 58%),radial-gradient(circle at 100% 0,#00f28f2c,transparent 32%);box-shadow:var(--shadow)}.hero h1{margin:5px 0 3px;font-size:29px}.good{color:var(--green)}.watch{color:var(--yellow)}.heroSwap,.move{display:grid;grid-template-columns:1fr 32px 1fr;gap:8px;align-items:center;margin-top:12px}.swapBox,.transfer,.mini,.gwcard{border:1px solid var(--line);background:#0d071d99;border-radius:16px}.swapBox{padding:11px}.arrow{text-align:center;font-size:21px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.stat{text-align:center;padding:8px;border-radius:12px;background:#ffffff0b}.stat b{display:block;font-size:17px}.stat span{font-size:9px;color:var(--muted)}.deadline{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding:11px 13px;border-radius:16px;background:#ffffff0a;border:1px solid var(--line)}.count{font-size:21px;font-weight:950}.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px 0;margin-top:8px;background:linear-gradient(#080214f7,#080214dd,transparent);backdrop-filter:blur(14px)}.tab{border:1px solid var(--line);border-radius:13px;padding:10px 5px;background:#ffffff0a;color:#d2cbdf;font-weight:850}.tab.active{background:linear-gradient(135deg,#7428ff,#a03dff);color:white;border-color:transparent}.panel{display:none}.panel.active{display:block}.sectionTitle{font-size:18px;font-weight:900;margin:12px 2px 7px}.pitch{position:relative;min-height:565px;padding:18px 8px;border-radius:26px;background:linear-gradient(90deg,#087a47,#0a6b40 50%,#087a47);border:1px solid #8effc755;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-around}.pitch:before{content:"";position:absolute;inset:6%;border:1px solid #ffffff3b}.pitch:after{content:"";position:absolute;left:6%;right:6%;top:50%;border-top:1px solid #ffffff3b}.row{position:relative;z-index:1;display:flex;justify-content:center;gap:5px}.player{width:min(22vw,105px);min-width:72px;text-align:center;filter:drop-shadow(0 8px 9px #0005)}.shirt{position:relative;height:52px;margin:auto;width:58px;background:linear-gradient(135deg,var(--c1),var(--c2));clip-path:polygon(22% 0,38% 8%,62% 8%,78% 0,100% 22%,85% 36%,80% 28%,80% 100%,20% 100%,20% 28%,15% 36%,0 22%);border-radius:8px}.shirt:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff28 49%,transparent 67%)}.capt{position:absolute;right:-4px;top:-5px;z-index:2;display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#120725;color:white;border:2px solid var(--green);font-size:9px;font-weight:950}.pname{display:inline-block;max-width:100%;margin-top:-1px;padding:3px 7px;border-radius:7px;background:#f6f3fa;color:#170d23;font-size:10px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 8px #0005}.pxp{display:block;font-size:9px;color:#f0eafa;text-shadow:0 1px 3px #000;margin-top:2px}.bench{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.mini{padding:8px;text-align:center}.mini .shirt{width:42px;height:38px}.mini .pname{font-size:9px;max-width:100%}.transfer{margin-top:9px;padding:14px}.transferHead{display:flex;justify-content:space-between}.status{font-size:10px;font-weight:950;padding:5px 8px;border-radius:999px}.do{color:var(--green);background:#00f28f1c}.consider{color:var(--yellow);background:#ffd34f1c}.weak{color:#ff9aac;background:#ff66801c}.reason{margin-top:9px;padding:10px;border-left:3px solid var(--purple);background:#7b2cff14;border-radius:0 10px 10px 0;font-size:12px;color:#cbc3d9}.future{display:grid;gap:8px}.gwcard{padding:14px}.gwtop{display:flex;justify-content:space-between}.footer{text-align:center;color:#766e88;font-size:10px;margin-top:18px}@media(min-width:700px){.pitch{min-height:640px}.player{width:110px}.shirt{width:66px;height:59px}}</style></head><body><main class="app"><header class="top"><div><div class="brand">FPL AUTOPILOT</div><div class="title">Command Center</div><div class="muted" id="updated">Laster analyse…</div></div><div class="live"><i class="dot"></i>AUTO</div></header><section class="hero"><div class="eyebrow">Hva bør jeg gjøre nå?</div><h1 id="headline">Laster…</h1><div class="muted" id="summary"></div><div id="heroMove"></div><div class="deadline"><div><div class="eyebrow">Neste deadline</div><div class="count" id="countdown">—</div></div><div style="text-align:right"><div class="eyebrow">Datagrunnlag</div><b id="snapshot">—</b></div></div></section><nav class="tabs"><button class="tab active" data-tab="team">Mitt lag</button><button class="tab" data-tab="moves">Bytter</button><button class="tab" data-tab="plan">Plan</button></nav><section id="team" class="panel active"><div class="sectionTitle">Anbefalt startellever</div><div class="pitch" id="pitch"></div><div class="sectionTitle">Benk</div><div class="bench" id="bench"></div></section><section id="moves" class="panel"><div class="sectionTitle">Rangerte bytter</div><div id="transfers"></div></section><section id="plan" class="panel"><div class="sectionTitle">Plan fremover</div><div class="future" id="future"></div></section><div class="footer">Sanitert offentlig visning · automatiske analyser · norsk tid</div></main><script>const q=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let D;const COLORS={'Arsenal':['#e30613','#ffffff'],'Aston Villa':['#7a003c','#95d8f4'],'Bournemouth':['#d71920','#111111'],'Brentford':['#e30613','#ffffff'],'Brighton':['#0057b8','#ffffff'],'Burnley':['#6c1d45','#99d6ea'],'Chelsea':['#034694','#ffffff'],'Crystal Palace':['#1b458f','#c4122e'],'Everton':['#003399','#ffffff'],'Fulham':['#ffffff','#111111'],'Leeds':['#ffffff','#1d428a'],'Liverpool':['#c8102e','#00b2a9'],'Man City':['#6cabdd','#ffffff'],'Man Utd':['#da291c','#fbe122'],'Newcastle':['#111111','#ffffff'],"Nott'm Forest":['#e53233','#ffffff'],'Sunderland':['#eb172b','#ffffff'],'Spurs':['#ffffff','#132257'],'West Ham':['#7a263a','#1bb1e7'],'Wolves':['#fdb913','#231f20']};function col(t){return COLORS[t]||['#6333d7','#eee']}function fmt(v){return(Number(v)>=0?'+':'')+Number(v).toFixed(2)}function sc(s){return s==='GJØR DET'?'do':s==='VURDERES'?'consider':'weak'}function shirt(p,mini=false){let c=col(p.team),tag=p.captain?'C':p.vice?'V':'';return `<div class="${mini?'mini':'player'}" style="--c1:${c[0]};--c2:${c[1]}"><div class="shirt">${tag?`<i class="capt">${tag}</i>`:''}</div><span class="pname">${esc(p.name)}</span><span class="pxp">${Number(p.xp).toFixed(2)} xP${mini?'':' · '+esc(p.fixture)}</span></div>`}function pitch(xs){return ['FWD','MID','DEF','GK'].map(pos=>`<div class="row">${xs.filter(x=>x.position===pos).map(x=>shirt(x)).join('')}</div>`).join('')}function countdown(){if(!D?.deadline_time){q('#countdown').textContent='Ikke satt';return}let ms=new Date(D.deadline_time)-new Date;if(ms<=0){q('#countdown').textContent='Passert';return}let h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);q('#countdown').textContent=`${Math.floor(h/24)}d ${h%24}t ${m}m`}function transfer(c,i){let x=c.pairs[0],reason=c.gate_misses?.length?'Mangler: '+esc(c.gate_misses.join(' · ')):'Passerer modellens terskler over kort og lengre horisont.';return `<article class="transfer"><div class="transferHead"><b>#${i+1}</b><span class="status ${sc(c.status)}">${esc(c.status)}</span></div><div class="move"><div class="swapBox"><div class="eyebrow">UT</div><b>${esc(x.out.name)}</b><div class="muted">${esc(x.out.team)} · ${x.out.xp.toFixed(2)} xP</div></div><div class="arrow">→</div><div class="swapBox"><div class="eyebrow">INN</div><b>${esc(x.in.name)}</b><div class="muted">${esc(x.in.team)} · ${x.in.xp.toFixed(2)} xP</div></div></div><div class="stats"><div class="stat"><b>${fmt(c.edge)}</b><span>edge</span></div><div class="stat"><b>${fmt(c.short_gain)}</b><span>3 GW</span></div><div class="stat"><b>${fmt(c.horizon_gain)}</b><span>horisont</span></div></div><div class="reason">${reason}</div></article>`}async function load(){let r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'});D=await r.json();q('#updated').textContent='Sist analysert '+new Intl.DateTimeFormat('nb-NO',{timeZone:'Europe/Oslo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(D.generated_at));q('#headline').textContent=D.headline;q('#headline').className=D.headline.includes('GJØR')?'good':'watch';q('#summary').textContent=D.summary;q('#snapshot').textContent=`GW${D.source_snapshot_gw} → GW${D.gw}`;if(D.recommendation?.transfers?.length){let x=D.recommendation.transfers[0];q('#heroMove').innerHTML=`<div class="heroSwap"><div class="swapBox"><div class="eyebrow">UT</div><b>${esc(x.out.name)}</b><div class="muted">${esc(x.out.team)}</div></div><div class="arrow">→</div><div class="swapBox"><div class="eyebrow">INN</div><b>${esc(x.in.name)}</b><div class="muted">${esc(x.in.team)}</div></div></div><div class="stats"><div class="stat"><b>${fmt(D.recommendation.edge)}</b><span>modell-edge</span></div><div class="stat"><b>0</b><span>hit</span></div><div class="stat"><b>GW${D.gw}</b><span>mål</span></div></div>`}else q('#heroMove').innerHTML='<div class="reason">Ingen transfer passerer terskelen nå. Bank transfer og overvåk videre.</div>';q('#pitch').innerHTML=pitch(D.lineup||[]);q('#bench').innerHTML=(D.bench||[]).map(p=>shirt(p,true)).join('');q('#transfers').innerHTML=(D.candidates||[]).map(transfer).join('')||'<div class="reason">Ingen aktuelle bytter.</div>';q('#future').innerHTML=(D.future||[]).map(x=>`<div class="gwcard"><div class="gwtop"><div><div class="eyebrow">GAMEWEEK ${x.gw}</div><h3>${esc(x.captain)} ©</h3></div><div style="text-align:right"><b>${Number(x.xi_xp).toFixed(1)}</b><div class="muted">XI xP</div></div></div><div class="muted">Kaptein xP ${Number(x.captain_xp).toFixed(2)}</div></div>`).join('');countdown()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');q('#'+b.dataset.tab).classList.add('active')});setInterval(countdown,30000);load().catch(e=>{q('#headline').textContent='Kunne ikke laste dashboard';q('#summary').textContent=e.message});</script></body></html>
